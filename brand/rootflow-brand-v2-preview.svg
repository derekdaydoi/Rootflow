        <path d="M64 58C53 58 47 52 47 43C47 34 40 28 30 28"/><path d="M64 58V19"/><path d="M64 58C75 58 81 52 81 43C81 34 88 28 98 28"/>
      </g>
      <text x="0" y="158" font-size="13" font-weight="720" fill="#6D7771">MONO / DARK TILE</text>
    </g>

    <g transform="translate(1176 248)">
      <rect width="126" height="126" rx="30" fill="#F6F8F6" stroke="#E6EBE7"/>
      <g transform="translate(15 14) scale(.75)" fill="none" stroke="#087A4C" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M64 82V58"/><path d="M64 82C55 82 49 87 45 94L38 106"/><path d="M64 82V108"/><path d="M64 82C73 82 79 87 83 94L90 106"/>
        <path d="M64 58C53 58 47 52 47 43C47 34 40 28 30 28"/><path d="M64 58V19"/><path d="M64 58C75 58 81 52 81 43C81 34 88 28 98 28"/>
      </g>
      <text x="0" y="158" font-size="13" font-weight="720" fill="#6D7771">CORE / LIGHT TILE</text>
    </g>

    <text x="72" y="570" font-size="15" font-weight="760" letter-spacing="1.5" fill="#6D7771">SYSTEM ANATOMY</text>
    <g transform="translate(72 602)">
      <rect width="390" height="220" rx="24" fill="#FFFFFF" stroke="#E6EBE7"/>
      <text x="24" y="38" font-size="14" font-weight="740" fill="#111A15">ROOT MASTER</text>
      <text x="24" y="61" font-size="12" fill="#6D7771">Invariant across the family</text>
      <g transform="translate(132 74) scale(.92)" fill="none" stroke="#087A4C" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M64 82V58"/><path d="M64 82C55 82 49 87 45 94L38 106"/><path d="M64 82V108"/><path d="M64 82C73 82 79 87 83 94L90 106"/>
      </g>
    </g>

    <g transform="translate(486 602)">
      <rect width="390" height="220" rx="24" fill="#FFFFFF" stroke="#E6EBE7"/>
      <text x="24" y="38" font-size="14" font-weight="740" fill="#111A15">FLOW CROWN</text>
      <text x="24" y="61" font-size="12" fill="#6D7771">Movement without arrows or decoration</text>
