<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Rootflow smart treasury mark</title>
  <desc id="desc">A lightbulb with a finance coin and a separated gear, representing financial clarity, capital and controlled systems.</desc>
  <metadata>Copyright © 2026 @derekdaydoi. All rights reserved. Rootflow brand asset.</metadata>
  <defs>
    <linearGradient id="rf-green" x1="22" y1="108" x2="112" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F4F35"/>
      <stop offset="1" stop-color="#1C8A58"/>
    </linearGradient>
  </defs>

  <g aria-hidden="true">
    <!-- Gear is deliberately offset to the right so it reads as a separate system element. -->
    <g fill="#1C8A58" stroke="#0F4F35" stroke-width="4.5" stroke-linejoin="round">
      <circle cx="98" cy="66" r="16"/>
      <rect x="94" y="42" width="8" height="13" rx="2.5"/>
      <rect x="94" y="42" width="8" height="13" rx="2.5" transform="rotate(45 98 66)"/>
      <rect x="94" y="42" width="8" height="13" rx="2.5" transform="rotate(90 98 66)"/>
      <rect x="94" y="42" width="8" height="13" rx="2.5" transform="rotate(135 98 66)"/>
      <rect x="94" y="42" width="8" height="13" rx="2.5" transform="rotate(180 98 66)"/>
      <rect x="94" y="42" width="8" height="13" rx="2.5" transform="rotate(225 98 66)"/>
      <rect x="94" y="42" width="8" height="13" rx="2.5" transform="rotate(270 98 66)"/>
      <rect x="94" y="42" width="8" height="13" rx="2.5" transform="rotate(315 98 66)"/>
    </g>
    <circle cx="98" cy="66" r="7" fill="#F5F6F2" stroke="#0F4F35" stroke-width="5"/>

    <!-- Bulb stays dominant; its right edge only lightly meets the gear silhouette. -->
    <path d="M43 12C23 12 10 27 10 47c0 12 5 21 13 30 4 4 6 8 6 13h28c0-5 2-9 6-13 8-9 13-18 13-30C76 27 63 12 43 12Z" fill="#E8F2EB" stroke="#0F4F35" stroke-width="6.5" stroke-linejoin="round"/>
    <path d="M27 31c4-7 9-11 16-13" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity=".72"/>

    <circle cx="43" cy="48" r="17" fill="#1C8A58" stroke="#0F4F35" stroke-width="5.5"/>
    <path d="M50 39c-3-4-11-4-14 1-4 6 3 9 8 10 7 2 10 6 7 11-4 5-13 5-16-2" fill="none" stroke="#0F4F35" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M43 33v6M43 61v6" fill="none" stroke="#0F4F35" stroke-width="4.2" stroke-linecap="round"/>

    <rect x="25" y="88" width="36" height="12" rx="6" fill="url(#rf-green)" stroke="#0F4F35" stroke-width="5"/>
    <rect x="28" y="99" width="30" height="11" rx="5.5" fill="#1C8A58" stroke="#0F4F35" stroke-width="5"/>
    <path d="M34 109h18c0 6-4 10-9 10s-9-4-9-10Z" fill="#1C8A58" stroke="#0F4F35" stroke-width="5" stroke-linejoin="round"/>
    <path d="M32 94h10" stroke="#79D8A5" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>
  </g>
</svg>
