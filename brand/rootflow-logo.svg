    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 88 C35 86 39 68 45 48 C49 34 55 27 68 27 H78 C89 27 96 34 96 44 C96 56 88 63 75 63 H61" stroke="#101110" stroke-width="10"/>
