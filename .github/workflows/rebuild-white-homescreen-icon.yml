name: Rebuild white homescreen icon

on:
  push:
    branches: [tmp-white-homescreen-icon]
    paths:
      - '.github/workflows/rebuild-white-homescreen-icon.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-white-homescreen-icon
      - name: Build opaque white homescreen icons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          try:
              from PIL import Image
          except Exception:
              raise SystemExit('Pillow is required on the runner')

          src_path = Path('brand/rootflow-mark.png')
          src = Image.open(src_path).convert('RGBA')

          # Preserve the approved artwork geometry. Only resize and place it on
          # an opaque white canvas so iOS never substitutes a dark fill for alpha.
          outputs = [
              ('rootflow-touch-180.png', 180),
              ('rootflow-icon-192.png', 192),
              ('rootflow-icon-512.png', 512),
          ]
          for name, size in outputs:
              mark = src.resize((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (size, size), (255, 255, 255, 255))
              canvas.alpha_composite(mark)
              out = canvas.convert('RGB')
              out.save(name, 'PNG', optimize=True)
              check = Image.open(name).convert('RGBA')
              assert check.getpixel((0, 0)) == (255, 255, 255, 255), (name, check.getpixel((0, 0)))
              assert check.getpixel((size - 1, size - 1)) == (255, 255, 255, 255), (name, check.getpixel((size - 1, size - 1)))

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('rootflow-home-192.png', 'rootflow-icon-192.png')
          s = s.replace('rootflow-home-180.png', 'rootflow-touch-180.png')
          p.write_text(s)

          p = Path('manifest.json')
          s = p.read_text()
          s = s.replace('rootflow-home-180.png', 'rootflow-touch-180.png')
          s = s.replace('rootflow-home-192.png', 'rootflow-icon-192.png')
          s = s.replace('rootflow-home-512.png', 'rootflow-icon-512.png')
          p.write_text(s)

          p = Path('sw.js')
          s = p.read_text()
          s = s.replace("rootflow-cache-2026-09-07-production-final-motion-white-homescreen", "rootflow-cache-2026-09-07-white-touch-icon")
          s = s.replace('rootflow-home-180.png', 'rootflow-touch-180.png')
          s = s.replace('rootflow-home-192.png', 'rootflow-icon-192.png')
          s = s.replace('rootflow-home-512.png', 'rootflow-icon-512.png')
          p.write_text(s)

          p = Path('README.md')
          s = p.read_text()
          s = s.replace('rootflow-home-180.png', 'rootflow-touch-180.png')
          s = s.replace('rootflow-home-192.png', 'rootflow-icon-192.png')
          s = s.replace('rootflow-home-512.png', 'rootflow-icon-512.png')
          p.write_text(s)
          PY
      - name: Replace cached transparent icons and self-clean workflow
        shell: bash
        run: |
          git config user.name "Nguyen Thai Hoang"
          git config user.email "hoangthai.personal@gmail.com"
          git rm -f rootflow-home-180.png rootflow-home-192.png rootflow-home-512.png
          git rm -f .github/workflows/rebuild-white-homescreen-icon.yml
          git add rootflow-touch-180.png rootflow-icon-192.png rootflow-icon-512.png index.html manifest.json sw.js README.md
          git commit -m "fix: use opaque white iOS homescreen icon"
          git push origin HEAD:tmp-white-homescreen-icon
