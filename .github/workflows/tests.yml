name: Rootflow final logo release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build final logo assets
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64

          root = Path('.')
          src = root / 'rootflow-icon-512-v3.png'
          im = Image.open(src).convert('RGBA')
          crop = im
          outputs = [
              (180, 'rootflow-touch-180-v3.png'),
              (192, 'rootflow-icon-192-v3.png'),
              (512, 'rootflow-icon-512-v3.png'),
          ]
          for size, name in outputs:
              crop.resize((size, size), Image.Resampling.LANCZOS).save(root / name, optimize=True)

          icon512 = root / 'rootflow-icon-512-v3.png'
          data_uri = 'data:image/png;base64,' + base64.b64encode(icon512.read_bytes()).decode('ascii')

          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('manifest.json?v=20260909-homescreen-v2', 'manifest.json?v=20260909-homescreen-v3')
          index = index.replace('rootflow-icon-192-v2.png?v=20260909', 'rootflow-icon-192-v3.png?v=20260909-final')
          index = index.replace('rootflow-touch-180-v2.png?v=20260909', 'rootflow-touch-180-v3.png?v=20260909-final')
          preload = '  <link rel="preload" as="image" href="rootflow-icon-512-v2.png?v=20260909-splash-v1" type="image/png">\n'
          index = index.replace(preload, '')
          start = index.index('        <img class="splash-logo"')
          end = index.index('>', start) + 1
          img = f'        <img class="splash-logo" src="{data_uri}" alt="" aria-hidden="true" decoding="sync">'
          index = index[:start] + img + index[end:]
          index_path.write_text(index, encoding='utf-8')

          manifest_path = root / 'manifest.json'
          manifest = manifest_path.read_text(encoding='utf-8')
          manifest = manifest.replace('rootflow-touch-180-v2.png', 'rootflow-touch-180-v3.png')
          manifest = manifest.replace('rootflow-icon-192-v2.png', 'rootflow-icon-192-v3.png')
          manifest = manifest.replace('rootflow-icon-512-v2.png', 'rootflow-icon-512-v3.png')
          manifest_path.write_text(manifest, encoding='utf-8')

          css_path = root / 'brand/rootflow-splash.css'
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('width:min(70vw,304px)', 'width:min(78vw,330px)')
          css = css.replace('width:min(74vw,290px)', 'width:min(80vw,310px)')
          css_path.write_text(css, encoding='utf-8')

          sw_path = root / 'sw.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace("rootflow-cache-2026-09-09-green-logo-v7-valid-png-splash", "rootflow-cache-2026-09-09-green-logo-v8-inline-final")
          sw = sw.replace("  './rootflow-icon-512-v2.png?v=20260909-splash-v1',\n", '')
          sw = sw.replace("manifest.json?v=20260909-homescreen-v2", "manifest.json?v=20260909-homescreen-v3")
          sw = sw.replace("rootflow-touch-180-v2.png?v=20260909", "rootflow-touch-180-v3.png?v=20260909-final")
          sw = sw.replace("rootflow-icon-192-v2.png?v=20260909", "rootflow-icon-192-v3.png?v=20260909-final")
          sw = sw.replace("rootflow-icon-512-v2.png", "rootflow-icon-512-v3.png")
          sw = sw.replace("rootflow-touch-180-v2\\.png|rootflow-icon-192-v2\\.png|rootflow-icon-512-v2\\.png", "rootflow-touch-180-v3\\.png|rootflow-icon-192-v3\\.png|rootflow-icon-512-v3\\.png")
          sw_path.write_text(sw, encoding='utf-8')

          test_path = root / 'tests/run-ui-contract-tests.js'
          test = test_path.read_text(encoding='utf-8')
          test = test.replace("const touchIcon = fs.readFileSync(path.join(__dirname, '..', 'rootflow-touch-180-v2.png'));", "const touchIcon = fs.readFileSync(path.join(__dirname, '..', 'rootflow-touch-180-v3.png'));")
          test = test.replace("const icon192 = fs.readFileSync(path.join(__dirname, '..', 'rootflow-icon-192-v2.png'));", "const icon192 = fs.readFileSync(path.join(__dirname, '..', 'rootflow-icon-192-v3.png'));")
          test = test.replace("const icon512 = fs.readFileSync(path.join(__dirname, '..', 'rootflow-icon-512-v2.png'));", "const icon512 = fs.readFileSync(path.join(__dirname, '..', 'rootflow-icon-512-v3.png'));")
          old = "assert(index.includes('rootflow-icon-512-v2.png?v=20260909-splash-v1'), 'opening splash must reference the validated supplied PNG logo asset');\nassert(!index.includes('brand/rootflow-opening-logo.webp'), 'opening splash must never return to the corrupted WebP asset');\nassert(icon512.length > 1000 && icon512.slice(0, 8).toString('hex') === '89504e470d0a1a0a', 'canonical opening logo must be a real PNG binary');"
          new = "const splashMatch = index.match(/<img class=\\\"splash-logo\\\" src=\\\"data:image\\/png;base64,([^\\\"]+)\\\"/);\nassert(splashMatch, 'opening splash must inline the canonical PNG logo so startup never depends on an external image request');\nconst splashLogo = Buffer.from(splashMatch[1], 'base64');\nassert(splashLogo.length > 20000 && splashLogo.slice(0, 8).toString('hex') === '89504e470d0a1a0a', 'inlined opening logo must be a real PNG binary');\nassert(icon512.length > 1000 && icon512.slice(0, 8).toString('hex') === '89504e470d0a1a0a', 'canonical homescreen logo must be a real PNG binary');"
          if old not in test:
              raise SystemExit('expected splash test block not found')
          test = test.replace(old, new)
          test = test.replace("rootflow-touch-180-v2.png?v=20260909", "rootflow-touch-180-v3.png?v=20260909-final")
          test = test.replace("rootflow-icon-192-v2.png?v=20260909", "rootflow-icon-192-v3.png?v=20260909-final")
          test = test.replace("rootflow-touch-180-v2.png') && manifest.includes('rootflow-icon-192-v2.png') && manifest.includes('rootflow-icon-512-v2.png", "rootflow-touch-180-v3.png') && manifest.includes('rootflow-icon-192-v3.png') && manifest.includes('rootflow-icon-512-v3.png")
          test = test.replace("sw.includes(\"'./brand/rootflow-splash.css'\") && sw.includes(\"'./brand/rootflow-theme.css'\") && sw.includes('rootflow-icon-512-v2.png?v=20260909-splash-v1') && sw.includes(\"'./operating-policy.js'\")", "sw.includes(\"'./brand/rootflow-splash.css'\") && sw.includes(\"'./brand/rootflow-theme.css'\") && sw.includes(\"'./operating-policy.js'\")")
          test = test.replace("assert(!sw.includes('rootflow-opening-logo.webp'), 'service worker must not cache the corrupted WebP opening logo');\n", "")
          test = test.replace("assert(sw.includes('rootflow-icon-512-v2\\\\.png') && sw.includes('rootflow-theme\\\\.css'), 'opening logo and theme must use network-first refresh policy');\n", "assert(sw.includes('rootflow-theme\\\\.css'), 'theme must use network-first refresh policy');\n")
          test = test.replace("green-logo-v7-valid-png-splash", "green-logo-v8-inline-final")
          test = test.replace("rootflow-touch-180-v2\\\\.png", "rootflow-touch-180-v3\\\\.png")
          test = test.replace("rootflow-icon-192-v2\\\\.png", "rootflow-icon-192-v3\\\\.png")
          test = test.replace("rootflow-icon-512-v2\\\\.png", "rootflow-icon-512-v3\\\\.png")
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Financial invariants
        run: node tests/run-tests.js
      - name: Cashflow regressions
        run: node tests/run-cashflow-tests.js
      - name: Store regressions
        run: node tests/run-store-tests.js
      - name: Canonical cashflow regressions
        run: node tests/run-canonical-tests.js
      - name: Capital decision regressions
        run: node tests/run-capital-tests.js
      - name: Syntax
        run: |
          node --check app.js
          node --check operating-policy.js
          node --check capital-ui.js
          node --check capital-domain.js
          node --check cashflow-domain.js
          node --check store.js
      - name: UI contract
        run: node tests/run-ui-contract-tests.js
      - name: React ownership contract
        run: node tests/run-account-editor-tests.js
      - name: Publish final logo release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.json sw.js brand/rootflow-splash.css tests/run-ui-contract-tests.js rootflow-touch-180-v3.png rootflow-icon-192-v3.png rootflow-icon-512-v3.png
          git commit -m "fix: finalize Rootflow splash and homescreen logo"
          git push origin HEAD:main
