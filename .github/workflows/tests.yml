name: Rootflow regression tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration patch on production integration PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'rootflow-production-integration'
        run: |
          python tools/integrate-runtime.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.js index.html capital.css
            git commit -m "chore: apply Rootflow integration patch"
            git push origin HEAD:rootflow-production-integration
          fi
      - name: Financial invariants
        run: node tests/run-tests.js
      - name: Cashflow regressions
        run: node tests/run-cashflow-tests.js
      - name: Store regressions
        run: node tests/run-store-tests.js
      - name: Compatibility regressions
        run: node tests/run-compat-tests.js
      - name: Capital decision regressions
        run: node tests/run-capital-tests.js
      - name: Application syntax
        run: node --check app.js
      - name: Capital UI syntax
        run: node --check capital-ui.js
      - name: Capital domain syntax
        run: node --check capital-domain.js
      - name: Account editor syntax
        run: node --check account-editor.js
      - name: UI contract
        run: node tests/run-ui-contract-tests.js
      - name: Account editor contract
        run: node tests/run-account-editor-tests.js
