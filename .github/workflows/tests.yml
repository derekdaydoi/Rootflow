name: Rootflow regression tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonicalize production markers
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'rootflow-production-integration' && hashFiles('tools/cleanup-production-markers.py') != ''
        run: |
          python tools/cleanup-production-markers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: canonicalize production markers"
          git push origin HEAD:rootflow-production-integration
      - name: Apply one-shot Rootflow canonical rebuild
        if: hashFiles('tools/rootflow-canonicalize.py') != '' && hashFiles('tools/rootflow-canonicalize-error.txt') == ''
        run: |
          set +e
          python tools/rootflow-canonicalize.py 2> /tmp/rootflow-canonicalize-error.txt
          code=$?
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$code" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/rootflow-canonicalize-error.txt tools/rootflow-canonicalize-error.txt
            git add tools/rootflow-canonicalize-error.txt
            git commit -m "ci: capture canonical rebuild failure"
            git push origin HEAD:main
            exit 1
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "refactor: rebuild Rootflow on one canonical runtime"
            git push origin HEAD:main
          fi
      - name: Financial invariants
        run: node tests/run-tests.js
      - name: Cashflow regressions
        run: node tests/run-cashflow-tests.js
      - name: Store regressions
        run: node tests/run-store-tests.js
      - name: Compatibility regressions
        run: node tests/run-compat-tests.js
      - name: Capital decision regressions
        run: node tests/run-capital-tests.js
      - name: Application syntax
        run: node --check app.js
      - name: Capital UI syntax
        run: node --check capital-ui.js
      - name: Capital domain syntax
        run: node --check capital-domain.js
      - name: UI contract
        run: node tests/run-ui-contract-tests.js
      - name: React ownership contract
        run: node tests/run-account-editor-tests.js
