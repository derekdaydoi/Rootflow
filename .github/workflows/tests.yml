name: Rootflow canonical release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prune retired UI selectors
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet tinycss2
          python - <<'PY'
          from pathlib import Path
          import re
          import tinycss2

          used = '\n'.join(Path(path).read_text() for path in ('app.js', 'capital-ui.js', 'index.html'))
          css_path = Path('styles.css')
          css = css_path.read_text()

          def present(class_name):
              return re.search(r'(?<![A-Za-z0-9_-])' + re.escape(class_name) + r'(?![A-Za-z0-9_-])', used) is not None

          def split_selectors(tokens):
              groups, current = [], []
              for token in tokens:
                  if token.type == 'literal' and token.value == ',':
                      groups.append(current)
                      current = []
                  else:
                      current.append(token)
              groups.append(current)
              return groups

          def filter_rules(rules):
              kept_rules = []
              for rule in rules:
                  if rule.type == 'qualified-rule':
                      selectors = []
                      for group in split_selectors(rule.prelude):
                          selector = tinycss2.serialize(group).strip()
                          classes = re.findall(r'\.([A-Za-z_][A-Za-z0-9_-]*)', selector)
                          if not classes or any(present(name) for name in classes):
                              selectors.append(selector)
                      if not selectors:
                          continue
                      rule.prelude = tinycss2.parse_component_value_list(', '.join(selectors) + ' ')
                      kept_rules.append(rule)
                  elif rule.type == 'at-rule' and rule.content is not None and rule.lower_at_keyword in ('media', 'supports', 'layer', 'container'):
                      nested = filter_rules(tinycss2.parse_rule_list(rule.content, skip_whitespace=False, skip_comments=False))
                      if any(item.type in ('qualified-rule', 'at-rule') for item in nested):
                          rule.content = tinycss2.parse_component_value_list(tinycss2.serialize(nested))
                          kept_rules.append(rule)
                  else:
                      kept_rules.append(rule)
              return kept_rules

          text = tinycss2.serialize(filter_rules(tinycss2.parse_stylesheet(css, skip_whitespace=False, skip_comments=False)))
          for _ in range(2):
              rules = tinycss2.parse_stylesheet(text, skip_whitespace=False, skip_comments=False)
              kept = []
              for rule in rules:
                  if rule.type == 'at-rule' and rule.lower_at_keyword in ('keyframes', '-webkit-keyframes'):
                      name = tinycss2.serialize(rule.prelude).strip()
                      other_css = tinycss2.serialize([item for item in rules if item is not rule])
                      if not re.search(r'(?<![A-Za-z0-9_-])' + re.escape(name) + r'(?![A-Za-z0-9_-])', other_css):
                          continue
                  kept.append(rule)
              text = tinycss2.serialize(kept)

          text = re.sub(r'\n(?:[ \t]*\n){2,}', '\n\n', text)
          css_path.write_text(text)
          PY

      - name: Financial invariants
        run: node tests/run-tests.js
      - name: Cashflow regressions
        run: node tests/run-cashflow-tests.js
      - name: Store regressions
        run: node tests/run-store-tests.js
      - name: Canonical cashflow regressions
        run: node tests/run-canonical-tests.js
      - name: Capital decision regressions
        run: node tests/run-capital-tests.js
      - name: Application syntax
        run: node --check app.js
      - name: Capital UI syntax
        run: node --check capital-ui.js
      - name: Capital domain syntax
        run: node --check capital-domain.js
      - name: Cashflow domain syntax
        run: node --check cashflow-domain.js
      - name: Store syntax
        run: node --check store.js
      - name: UI contract
        run: node tests/run-ui-contract-tests.js
      - name: React ownership contract
        run: node tests/run-account-editor-tests.js

      - name: Publish canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          if ! git diff --cached --quiet; then
            git commit -m "style: remove retired Rootflow UI selectors"
            git push origin HEAD:main
          fi
