name: Rootflow confidence-state release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply confidence-state model
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "      repaymentMode: contract && contract.repaymentMode ? contract.repaymentMode : 'principal_interest',\n      settlementAccountId: contract && contract.settlementAccountId ? contract.settlementAccountId : liquidAccounts[0] ? liquidAccounts[0].id : '',",
              "      repaymentMode: contract && contract.repaymentMode ? contract.repaymentMode : 'principal_interest',\n      confidence: contract && contract.confidence ? contract.confidence : 'EXPECTED',\n      settlementAccountId: contract && contract.settlementAccountId ? contract.settlementAccountId : liquidAccounts[0] ? liquidAccounts[0].id : '',",
              'account confidence state')

          replace_once(
              "        confidence: contract ? contract.confidence || 'EXPECTED' : 'EXPECTED', status: contract ? contract.status : 'active',",
              "        confidence: form.confidence || 'EXPECTED', status: contract ? contract.status : 'active',",
              'persist contract confidence')

          replace_once(
              "        h(Field, { label: form.type === 'receivable' ? 'Tài khoản nhận tiền' : 'Tài khoản thanh toán' }, h(Select, { value: form.settlementAccountId, onChange: function (v) { set('settlementAccountId', v); } }, h('option', { value: '' }, 'Chọn tài khoản'), liquidAccounts.map(function (row) { return h('option', { key: row.id, value: row.id }, row.name); }))),\n        h(Field, { label: 'Chu kỳ thanh toán' },",
              "        h(Field, { label: form.type === 'receivable' ? 'Tài khoản nhận tiền' : 'Tài khoản thanh toán' }, h(Select, { value: form.settlementAccountId, onChange: function (v) { set('settlementAccountId', v); } }, h('option', { value: '' }, 'Chọn tài khoản'), liquidAccounts.map(function (row) { return h('option', { key: row.id, value: row.id }, row.name); }))),\n        h(Field, { label: 'Độ chắc chắn mặc định của lịch', help: 'Dùng cho các kỳ chưa được xác nhận riêng. Chắc chắn vẫn là forecast; chỉ giao dịch đã thực hiện mới làm đổi số dư.' }, h(Select, { value: form.confidence, onChange: function (v) { set('confidence', v); } }, h('option', { value: 'CERTAIN' }, 'Chắc chắn'), h('option', { value: 'EXPECTED' }, 'Dự kiến'), h('option', { value: 'UNCERTAIN' }, 'Chưa chắc chắn'))),\n        h(Field, { label: 'Chu kỳ thanh toán' },",
              'contract confidence field')

          replace_once(
              "  function rebuildContractSchedule(data, contract) {\n    data.flows.forEach(function (flow) {\n      if (flow.contractId === contract.id && flow.autoGenerated && !flow.confirmed) {\n        flow.skipped = true;\n        flow.updatedAt = S.now();\n      }\n    });",
              "  function rebuildContractSchedule(data, contract) {\n    var confidenceOverrides = {};\n    data.flows.forEach(function (flow) {\n      if (flow.contractId === contract.id && flow.autoGenerated && !flow.confirmed && !flow.skipped) {\n        confidenceOverrides[String(flow.scheduleRole || '') + '|' + String(flow.date || '')] = flow.confidence || contract.confidence || 'EXPECTED';\n      }\n      if (flow.contractId === contract.id && flow.autoGenerated && !flow.confirmed) {\n        flow.skipped = true;\n        flow.updatedAt = S.now();\n      }\n    });",
              'preserve period confidence')

          replace_once(
              "    function add(role, date, principalAmount, interestAmount, feeAmount, note) {\n      var amount = principalAmount + interestAmount + feeAmount;\n      if (!(amount > 0) || !date) return;\n      data.flows.push({",
              "    function add(role, date, principalAmount, interestAmount, feeAmount, note) {\n      var amount = principalAmount + interestAmount + feeAmount;\n      if (!(amount > 0) || !date) return;\n      var scheduledConfidence = confidenceOverrides[String(role || '') + '|' + String(date || '')] || confidence;\n      data.flows.push({",
              'period confidence lookup')

          replace_once(
              "        date: date, confirmed: false, confidence: confidence, skipped: false,",
              "        date: date, confirmed: false, confidence: scheduledConfidence, skipped: false,",
              'period confidence write')

          replace_once(
              "    var flow = props.flow;\n    var activeAccounts = props.data.accounts.filter(function (account) {",
              "    var flow = props.flow;\n    var scheduleLocked = !!flow.autoGenerated;\n    var activeAccounts = props.data.accounts.filter(function (account) {",
              'flow editor schedule lock')

          replace_once(
              "    function save() {\n      if (!form.date) return setError('Chọn ngày giao dịch.');",
              "    function save() {\n      if (scheduleLocked) {\n        props.onSave(Object.assign({}, flow, {\n          confidence: flow.confirmed ? 'CERTAIN' : form.confidence,\n          note: form.note.trim(), updatedAt: S.now()\n        }));\n        return;\n      }\n      if (!form.date) return setError('Chọn ngày giao dịch.');",
              'locked schedule save')

          replace_once(
              "        date: form.date,\n        confirmed: form.date <= D.today(),\n        confidence: form.date <= D.today() ? 'CERTAIN' : form.confidence,",
              "        date: form.date,\n        confirmed: !!flow.confirmed,\n        confidence: flow.confirmed ? 'CERTAIN' : form.confidence,",
              'separate confidence from actual')

          replace_once(
              "    var kindName = flow.kind === 'income' ? 'Tiền vào' : flow.kind === 'expense' ? 'Tiền ra' : flow.kind === 'collect' ? 'Thu nợ' : flow.kind === 'repay' ? 'Trả nợ' : flow.kind === 'transfer' ? 'Chuyển khoản' : 'Giao dịch';\n    return h(React.Fragment, null,",
              "    var kindName = flow.kind === 'income' ? 'Tiền vào' : flow.kind === 'expense' ? 'Tiền ra' : flow.kind === 'collect' ? 'Thu nợ' : flow.kind === 'repay' ? 'Trả nợ' : flow.kind === 'transfer' ? 'Chuyển khoản' : 'Giao dịch';\n    if (scheduleLocked) return h(React.Fragment, null,\n      h('p', { className: 'sheet-intro' }, 'Kỳ này do hợp đồng sinh ra. Có thể đổi độ chắc chắn riêng cho kỳ này mà không sửa số tiền hoặc ngày của hợp đồng.'),\n      !flow.confirmed ? h(Field, { label: 'Độ chắc chắn', help: 'Chắc chắn vẫn chưa phải Actual. Khi tiền thực sự vào hoặc ra, ghi nhận giao dịch thực tế.' }, h(Select, { value: form.confidence, onChange: function (value) { set('confidence', value); } },\n        h('option', { value: 'CERTAIN' }, 'Chắc chắn'), h('option', { value: 'EXPECTED' }, 'Dự kiến'), h('option', { value: 'UNCERTAIN' }, 'Chưa chắc chắn'))) : h('div', { className: 'data-note' }, 'Kỳ này đã được ghi nhận thực tế.'),\n      h(Field, { label: 'Ghi chú' }, h(TextInput, { value: form.note, onChange: function (event) { set('note', event.target.value); }, placeholder: 'Không bắt buộc' })),\n      error ? h('div', { className: 'field-error' }, error) : null,\n      h('button', { type: 'button', className: 'primary-button', onClick: save }, 'Lưu độ chắc chắn'));\n    return h(React.Fragment, null,",
              'confidence-only schedule editor')

          replace_once(
              "      form.date > D.today() ? h(Field, { label: 'Độ chắc chắn' }, h(Select, { value: form.confidence, onChange: function (value) { set('confidence', value); } },",
              "      !flow.confirmed ? h(Field, { label: 'Độ chắc chắn', help: 'Có thể đổi Dự kiến ↔ Chắc chắn kể cả trong ngày. Chắc chắn không tự biến thành giao dịch đã thực hiện.' }, h(Select, { value: form.confidence, onChange: function (value) { set('confidence', value); } },",
              'same-day confidence editor')

          replace_once(
              "      if (flow.kind === 'borrow' || flow.kind === 'lend' || flow.autoGenerated) {",
              "      if (flow.kind === 'borrow' || flow.kind === 'lend') {",
              'allow scheduled confidence edit')

          replace_once(
              "        next.flows[index] = flow;\n        var affected = [];",
              "        next.flows[index] = flow;\n        if (flow.autoGenerated) return;\n        var affected = [];",
              'do not rebuild confidence-only edit')

          path.write_text(text)

          test_path = Path('tests/run-ui-contract-tests.js')
          test = test_path.read_text()
          anchor = "assert(ui.includes('Giao dịch đã nhập') && ui.includes('props.onEditFlow'), 'recorded cashflows must expose correction from the canonical cashflow screen');\n"
          if anchor not in test:
              raise SystemExit('UI test anchor missing')
          additions = anchor + "assert(app.includes('var scheduleLocked = !!flow.autoGenerated'), 'auto-generated contract periods must expose a confidence-only editor');\nassert(app.includes('confidenceOverrides') && app.includes('scheduledConfidence'), 'period confidence overrides must survive contract schedule rebuilds');\nassert(app.includes(\"'Độ chắc chắn mặc định của lịch'\"), 'account editor must allow changing the default confidence of future contract periods');\nassert(app.includes(\"confirmed: !!flow.confirmed\") && app.includes(\"confidence: flow.confirmed ? 'CERTAIN' : form.confidence\"), 'editing confidence must never turn a same-day forecast into Actual');\nassert(app.includes(\"!flow.confirmed ? h(Field, { label: 'Độ chắc chắn'\"), 'planned flows must keep confidence editable on the due date');\n"
          test = test.replace(anchor, additions, 1)
          test_path.write_text(test)

          account_test_path = Path('tests/run-account-editor-tests.js')
          account_test = account_test_path.read_text()
          old_assert = "assert(app.includes(\"flow.kind === 'borrow' || flow.kind === 'lend' || flow.autoGenerated\"), 'borrow/lend and generated schedules must route back to their linked contract account');"
          new_assert = "assert(app.includes(\"flow.kind === 'borrow' || flow.kind === 'lend'\"), 'borrow/lend principal events must route back to their linked contract account');\nassert(app.includes('var scheduleLocked = !!flow.autoGenerated') && app.includes(\"'Lưu độ chắc chắn'\"), 'generated schedule rows must open a confidence-only editor instead of mutating contract terms');"
          if old_assert not in account_test:
              raise SystemExit('account-editor legacy schedule assertion missing')
          account_test = account_test.replace(old_assert, new_assert, 1)
          account_test_path.write_text(account_test)

          sw_path = Path('sw.js')
          sw = sw_path.read_text()
          sw, count = re.subn(r"var CACHE='rootflow-ui-[^']+';", "var CACHE='rootflow-ui-2026-09-09-confidence-r1';", sw, count=1)
          if count != 1:
              raise SystemExit(f'service-worker cache marker: expected one match, found {count}')
          sw_path.write_text(sw)
          PY
      - name: Financial invariants
        run: node tests/run-tests.js
      - name: Cashflow regressions
        run: node tests/run-cashflow-tests.js
      - name: Store regressions
        run: node tests/run-store-tests.js
      - name: Canonical cashflow regressions
        run: node tests/run-canonical-tests.js
      - name: Capital decision regressions
        run: node tests/run-capital-tests.js
      - name: Application syntax
        run: node --check app.js
      - name: Operating policy syntax
        run: node --check operating-policy.js
      - name: Capital UI syntax
        run: node --check capital-ui.js
      - name: Capital domain syntax
        run: node --check capital-domain.js
      - name: Cashflow domain syntax
        run: node --check cashflow-domain.js
      - name: Store syntax
        run: node --check store.js
      - name: UI contract
        run: node tests/run-ui-contract-tests.js
      - name: React ownership contract
        run: node tests/run-account-editor-tests.js
      - name: Push release
        run: |
          if git diff --quiet; then
            echo 'No source changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js tests/run-ui-contract-tests.js tests/run-account-editor-tests.js sw.js
          git commit -m 'feat: separate forecast confidence from actual cashflow'
          git push origin HEAD:main
