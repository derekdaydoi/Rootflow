name: Rootflow integration build

on:
  push:
    branches:
      - rootflow-production-integration

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'chore: apply Rootflow integration patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rootflow-production-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch React controller and canonical runtime entry
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text()
          s = s.replace('/* Rootflow V2 — refactored offline-first responsive app. */', '/* Rootflow — canonical offline-first application controller. */')
          s = s.replace('brand/rootflow-mark.svg', 'brand/rootflow-mark.png')
          old = """    var screen;
    if (subview === 'risk') screen = h(BufferRisk, { derived: derived, onBack: function () { setSubview(null); }, onSettings: function () { setOverlay('settings'); } });
    else if (subview === 'budgets') screen = h(BudgetScreen, { data: data, derived: derived, onBack: function () { setSubview(null); }, onEdit: editBudget });
    else if (view === 'flow') screen = h(FlowScreen, { data: data, derived: derived, onAdd: function () { setOverlay('composer'); }, onSettings: function () { setOverlay('settings'); } });
    else if (view === 'position') screen = h(PositionScreen, { data: data, derived: derived, onSettings: function () { setOverlay('settings'); } });
    else if (view === 'decide') screen = h(DecideScreen, { data: data, derived: derived, onSettings: function () { setOverlay('settings'); }, onToast: setToast, onSaveScenario: saveScenario });
    else screen = h(Home, { data: data, derived: derived, onSettings: function () { setOverlay('settings'); }, onAddAccount: openAddAccount, onBudgets: openBudgets, onRisk: function () { setSubview('risk'); global.scrollTo(0, 0); }, onFlow: function () { go('flow'); } });

    return h('div', { className: 'app' }, screen,
      h(BottomNav, { view: view, onGo: go, onAdd: function () { setOverlay('composer'); } }),"""
          new = """    var screen, bottom;
    var hasOperatingData = data.accounts.some(function (account) { return account && !account.archived; });
    if (!subview && hasOperatingData && global.RootflowCapitalUI) {
      screen = h(global.RootflowCapitalUI.Screen, {
        data: data,
        view: view,
        onView: go,
        onAdd: function () { setOverlay('composer'); },
        onCommit: commit
      });
      bottom = h(global.RootflowCapitalUI.BottomNav, { view: view, onGo: go, onAdd: function () { setOverlay('composer'); } });
    } else {
      if (subview === 'risk') screen = h(BufferRisk, { derived: derived, onBack: function () { setSubview(null); }, onSettings: function () { setOverlay('settings'); } });
      else if (subview === 'budgets') screen = h(BudgetScreen, { data: data, derived: derived, onBack: function () { setSubview(null); }, onEdit: editBudget });
      else if (view === 'flow') screen = h(FlowScreen, { data: data, derived: derived, onAdd: function () { setOverlay('composer'); }, onSettings: function () { setOverlay('settings'); } });
      else if (view === 'position') screen = h(PositionScreen, { data: data, derived: derived, onSettings: function () { setOverlay('settings'); } });
      else if (view === 'decide') screen = h(DecideScreen, { data: data, derived: derived, onSettings: function () { setOverlay('settings'); }, onToast: setToast, onSaveScenario: saveScenario });
      else screen = h(Home, { data: data, derived: derived, onSettings: function () { setOverlay('settings'); }, onAddAccount: openAddAccount, onBudgets: openBudgets, onRisk: function () { setSubview('risk'); global.scrollTo(0, 0); }, onFlow: function () { go('flow'); } });
      bottom = h(BottomNav, { view: view, onGo: go, onAdd: function () { setOverlay('composer'); } });
    }

    return h('div', { className: 'app' }, screen,
      bottom,"""
          if old not in s:
              raise SystemExit('App screen ownership block not found; refusing fuzzy patch')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('  <link rel="stylesheet" href="account-editor.css">\n', '')
          old_scripts = '  <script src="selftest.js"></script>\n  <script src="app.js"></script>\n  <script src="capital-ui.js"></script>\n  <script src="account-editor.js"></script>'
          new_scripts = '  <script src="selftest.js"></script>\n  <script src="capital-ui.js"></script>\n  <script src="app.js"></script>'
          if old_scripts not in s:
              raise SystemExit('Runtime script block not found; refusing fuzzy patch')
          s = s.replace(old_scripts, new_scripts)
          p.write_text(s)

          p = Path('capital.css')
          s = p.read_text()
          s = s.replace('/* Rootflow Capital OS — canonical decision-first visual system.', '/* Rootflow — canonical decision-first visual system.')
          s = s.replace('.content.rf-capital-os>*:not(.v4-panel){display:none!important}\n', '')
          s = s.replace('.v4-panel', '.rf-panel')
          s = s.replace('background:linear-gradient(145deg,var(--rf-green-deep),var(--rf-green) 70%,var(--rf-green-accent));', 'background:var(--rf-green-deep);')
          s = s.replace('.rf-available-hero:after{content:"";pointer-events:none;position:absolute;right:-38px;top:-46px;width:145px;height:145px;border-radius:50%;border:28px solid rgba(255,255,255,.045)}\n', '')
          s += '''\n\n/* Canonical React-owned app chrome */\n.rf-page{min-height:100dvh;padding-bottom:calc(82px + env(safe-area-inset-bottom,0px));background:var(--rf-bg)}\n.rf-appbar{position:sticky;z-index:30;top:0;min-width:0;min-height:calc(58px + env(safe-area-inset-top,0px));padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,calc((100vw - 720px)/2 + 16px)) 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(225,229,225,.84);background:rgba(245,246,242,.96);backdrop-filter:blur(10px)}\n.rf-brand-lockup{min-width:0;display:flex;align-items:center;gap:9px}\n.rf-brand-mark{width:36px;height:36px;display:block;object-fit:contain;flex:0 0 auto}\n.rf-brand-lockup>div{min-width:0;display:grid;gap:1px}\n.rf-brand-lockup strong{color:var(--rf-green-deep);font-size:18px;font-weight:800;line-height:1;letter-spacing:-.04em}\n.rf-brand-lockup strong b{color:var(--rf-green-accent);font-weight:800}\n.rf-brand-lockup span{color:var(--rf-muted);font-size:9px;font-weight:650;line-height:1.2}\n.rf-appbar-spacer{width:36px;height:36px}\n.rf-page>.content.rf-capital-os{width:min(100%,720px);margin:0 auto;padding:14px 16px 24px;min-width:0}\n.rf-panel{min-width:0;margin:0}\n.rf-bottom-nav.bottom-nav{position:fixed;z-index:70;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,720px);min-height:calc(66px + env(safe-area-inset-bottom,0px));padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 54px repeat(2,minmax(0,1fr));align-items:end;border:1px solid rgba(225,229,225,.9);border-bottom:0;border-radius:18px 18px 0 0;background:rgba(255,255,255,.98);box-shadow:0 -8px 26px rgba(22,27,24,.07)}\n.rf-bottom-nav .nav-button{min-width:0;min-height:52px;padding:5px 2px;display:grid;place-items:center;align-content:center;gap:3px;border:0;background:transparent;color:#7b837e;white-space:nowrap}\n.rf-bottom-nav .nav-button .rf-icon{width:20px;height:20px}\n.rf-bottom-nav .nav-button span{min-width:0;font-size:9px;font-weight:680;line-height:1;white-space:nowrap}\n.rf-bottom-nav .nav-button.on{color:var(--rf-green-deep)}\n.rf-bottom-nav .nav-add{align-self:start;justify-self:center;width:50px;height:50px;margin-top:-18px;display:grid;place-items:center;border:4px solid var(--rf-bg);border-radius:50%;background:var(--rf-green-deep);color:#fff;box-shadow:0 7px 18px rgba(15,79,53,.18)}\n.rf-bottom-nav .nav-add .rf-icon{width:21px;height:21px}\n.rf-hero-value,.rf-capital-hero>strong,.rf-screen-title>div>strong,.rf-explain-total strong,.rf-available-result strong{max-width:100%}\n@container rfpanel (max-width:360px){.rf-hero-value{font-size:clamp(23px,8.1cqi,34px);letter-spacing:-.055em}.rf-capital-hero>strong{font-size:clamp(22px,7.6cqi,32px)}}\n@media(max-width:359px){.rf-page>.content.rf-capital-os{padding-inline:12px}.rf-bottom-nav .nav-button span{font-size:8.5px}.rf-bottom-nav.bottom-nav{grid-template-columns:repeat(2,minmax(0,1fr)) 50px repeat(2,minmax(0,1fr))}.rf-brand-mark{width:34px;height:34px}}\n@media(min-width:721px){.rf-bottom-nav.bottom-nav{bottom:14px;border-radius:18px;border-bottom:1px solid rgba(225,229,225,.9)}.rf-page{padding-bottom:104px}}\n'''
          p.write_text(s)
          PY
      - name: Syntax check integrated runtime
        run: |
          node --check app.js
          node --check capital-ui.js
      - name: Commit integration patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html capital.css
          git commit -m "chore: apply Rootflow integration patch"
          git push origin HEAD:rootflow-production-integration
