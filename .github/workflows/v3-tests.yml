name: Rootflow regression tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing financial tests
        run: node tests/run-tests.js
      - name: V3 snapshot and buffer regressions
        run: node tests/run-v3-tests.js
      - name: V3 committed versus actual regressions
        run: node tests/run-v3-store-tests.js
      - name: V3 compatibility regressions
        run: node tests/run-v3-compat-tests.js
      - name: Capital OS decision regressions
        run: node tests/run-v4-tests.js
      - name: Capital OS UI JavaScript syntax
        run: node --check v4-ui.js
      - name: Canonical Capital OS domain syntax
        run: node --check v4-domain.js
      - name: Scoped legacy editor JavaScript syntax
        run: node --check v4-polish.js
      - name: Capital OS UI contract
        run: node tests/run-ui-contract-tests.js
      - name: Legacy editor compatibility contract
        run: node tests/run-polish-tests.js
