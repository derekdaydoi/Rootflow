name: Rootflow homescreen icon release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reduce homescreen artwork scale
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          path = Path('brand/rootflow-icon.png')
          image = Image.open(path).convert('RGBA')
          if image.size != (512, 512):
              raise SystemExit(f'Expected 512x512 install icon, got {image.size}')

          # Keep the Home Screen canvas exactly #BAFF9C while reducing only
          # the visible artwork footprint. The launch mark is a separate asset
          # and is intentionally untouched.
          canvas = Image.new('RGBA', (512, 512), (186, 255, 156, 255))
          target = 430  # ~84% of the previous icon footprint.
          reduced = image.resize((target, target), Image.Resampling.LANCZOS)
          offset = ((512 - target) // 2, (512 - target) // 2)
          canvas.alpha_composite(reduced, offset)
          canvas.convert('RGB').save(path, 'PNG', optimize=True)

          check = Image.open(path).convert('RGB')
          assert check.size == (512, 512)
          assert check.getpixel((0, 0)) == (186, 255, 156)
          assert check.getpixel((511, 511)) == (186, 255, 156)
          PY
      - name: Regression suite
        run: |
          node tests/run-tests.js
          node tests/run-cashflow-tests.js
          node tests/run-store-tests.js
          node tests/run-canonical-tests.js
          node tests/run-capital-tests.js
          node --check app.js
          node --check operating-policy.js
          node --check capital-ui.js
          node --check capital-domain.js
          node --check cashflow-domain.js
          node --check store.js
          node tests/run-ui-contract-tests.js
          node tests/run-account-editor-tests.js
      - name: Publish icon
        run: |
          if git diff --quiet -- brand/rootflow-icon.png; then
            echo 'No icon change detected.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand/rootflow-icon.png
          git commit -m 'style: reduce homescreen logo footprint'
          git push origin main
