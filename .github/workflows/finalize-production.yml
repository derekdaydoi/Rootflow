name: Finalize Rootflow production

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build canonical brand assets
        env:
          ROOTFLOW_LOGO_B64: ""
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          import base64, os
          from pathlib import Path
          from PIL import Image
          root = Path('.')
          raw = base64.b64decode(os.environ['ROOTFLOW_LOGO_B64'])
          source = root / '.rootflow-logo-source.png'
          source.write_bytes(raw)
          img = Image.open(source).convert('RGB')
          (root / 'brand').mkdir(exist_ok=True)
          img.save(root / 'brand/rootflow-mark.png', format='PNG', optimize=True)
          for size in (180, 192, 512):
              out = img.resize((size, size), Image.Resampling.LANCZOS)
              out.save(root / f'rootflow-icon-{size}.png', format='PNG', optimize=True)
          source.unlink()
          PY

      - name: Canonicalize runtime and remove build-history labels
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          app = root / 'app.js'
          text = app.read_text()
          text = text.replace('/* Rootflow V2 — Personal Treasury UI. React UMD, no build step. */','/* Rootflow application UI. React UMD, no build step. */')
          text = text.replace('brand/rootflow-mark.svg','brand/rootflow-mark.png')
          app.write_text(text)
          mapping = {
              'v3ProjectionPath':'cashflowProjectionPath','v3DebtCalendar':'cashflowDebtCalendar','v3FundingMap':'cashflowFundingMap','v3LendingBook':'cashflowLendingBook','v3TreasurySummary':'cashflowTreasurySummary','v3CashBridge':'cashflowBridge','v3CashRequirement':'cashflowRequirement','v3UndatedObligations':'cashflowUndatedObligations','v3Version':'cashflowDomainReady','effectAfterBaselineV3':'effectAfterBaseline','balancesV3':'balancesSnapshotAware','liquidityModelV3':'liquidityModelSnapshotAware','controlMetricsV3':'controlMetricsSnapshotAware','balancesV2':'balancesBase','liquidityModelV2':'liquidityModelBase','controlMetricsV2':'controlMetricsBase','simulateDecisionV2':'simulateDecisionBase','loadV2':'loadBase','importFileV2':'importFileBase','treasurySummaryV3':'treasurySummaryBase','liquidityV3':'liquidityCurrent','v4BalanceSheetSummary':'capitalBalanceSheetSummary','v4DebtStructure':'capitalDebtStructure','v4DebtCalendar':'capitalDebtCalendar','v4DebtHealth':'capitalDebtHealth','v4FundingCostSummary':'capitalFundingCostSummary','v4BusinessSummary':'capitalBusinessSummary','v4BudgetSummary':'capitalBudgetSummary','v4InvestmentSummary':'capitalInvestmentSummary','v4IncomePlanSummary':'incomePlanSummary','v4ProjectionSummary':'capitalProjectionSummary','v4CashRequirement':'capitalCashRequirement','v4LivingPlanSummary':'livingPlanSummary','v4OperatingSummary':'operatingSummary','v4CapitalSummary':'capitalSummary','v4FutureEvents':'futureEvents','v4FinalSummary':'finalSummary','v4Version':'capitalDomainReady'}
          for path in [*root.glob('*.js'),*root.glob('tests/*.js')]:
              text=path.read_text()
              for old,new in mapping.items(): text=text.replace(old,new)
              text=re.sub(r'Rootflow V[234]\b','Rootflow',text)
              text=re.sub(r'\bV2\b','base',text); text=re.sub(r'\bV3\b','current',text); text=re.sub(r'\bV4\b','current',text)
              text=text.replace('old domain implementation','base domain implementation').replace('old backups','existing backups').replace('legacy opening','opening-balance')
              text=text.replace("D.cashflowDomainReady = '3.0-explainable';","D.cashflowDomainReady = true;").replace("D.capitalDomainReady = '4.1-capital-os';","D.capitalDomainReady = true;")
              path.write_text(text)
          index=root/'index.html'; text=index.read_text().replace('href="icon-192.png"','href="rootflow-icon-192.png"').replace('href="icon-180.png"','href="rootflow-icon-180.png"'); index.write_text(text)
          manifest=root/'manifest.json'; text=manifest.read_text().replace('icon-180.png','rootflow-icon-180.png').replace('icon-192.png','rootflow-icon-192.png').replace('icon-512.png','rootflow-icon-512.png'); manifest.write_text(text)
          sw=root/'sw.js'; text=sw.read_text(); text=re.sub(r"var CACHE = '[^']+';","var CACHE = 'rootflow-cache-20260907-canonical';",text).replace("'./icon-180.png'","'./rootflow-icon-180.png'").replace("'./icon-192.png'","'./rootflow-icon-192.png'").replace("'./icon-512.png'","'./rootflow-icon-512.png'"); sw.write_text(text)
          t=root/'tests/run-ui-contract-tests.js'; text=t.read_text().replace("assert(sw.includes('capital-os-final'), 'PWA cache must be bumped for the final deploy');","assert(sw.includes('rootflow-cache-20260907-canonical'), 'PWA cache must use the canonical deploy key');")
          text='\n'.join(line for line in text.splitlines() if 'runtime entrypoint must not expose historical version layers' not in line and 'service worker must not cache historical version layers' not in line)+'\n'
          text+="\nassert(index.includes('rootflow-icon-180.png'), 'iOS Home Screen icon must use the canonical cache-busted asset');\nassert(index.includes('rootflow-icon-192.png'), 'favicon must use the canonical artwork');\nassert(!index.includes('icon-180.png\"'), 'old Home Screen icon reference must be gone');\n"; t.write_text(text)
          for name in ['icon-180.png','icon-192.png','icon-512.png','rootflow-home-180.b64.txt','rootflow-home-180.txt']:
              p=root/name
              if p.exists(): p.unlink()
          forbidden=re.compile(r'\b[Vv][234](?:\b|[A-Z])|brand/rootflow-mark\.svg')
          offenders=[]
          for path in [*root.glob('*.js'),*root.glob('tests/*.js'),root/'index.html',root/'sw.js',root/'README.md']:
              if path.exists() and forbidden.search(path.read_text(errors='ignore')): offenders.append(str(path))
          if offenders: raise SystemExit('Historical version/reference cleanup incomplete: '+', '.join(offenders))
          PY

      - name: Run production regression suite
        run: |
          node tests/run-tests.js
          node tests/run-cashflow-tests.js
          node tests/run-store-tests.js
          node tests/run-compat-tests.js
          node tests/run-capital-tests.js
          node --check app.js
          node --check capital-ui.js
          node --check capital-domain.js
          node --check cashflow-domain.js
          node --check compat.js
          node --check store-adapter.js
          node --check account-editor.js
          node tests/run-ui-contract-tests.js
          node tests/run-account-editor-tests.js

      - name: Commit final production tree
        run: |
          rm -f .github/workflows/finalize-production.yml
          git config user.name "Rootflow Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "feat: ship Rootflow production final"
          git push origin HEAD:main
