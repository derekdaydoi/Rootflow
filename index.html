<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <script>
    (function () {
      var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      if (standalone) document.documentElement.classList.add('standalone-pwa');
    })();
  </script>
  <meta name="theme-color" content="#F5F6F2">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rootflow">
  <meta name="description" content="Rootflow — hệ thống điều hành vốn và dòng tiền cá nhân.">
  <title>Rootflow — Vốn & Dòng tiền</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="rootflow-home-192.png" type="image/png">
  <link rel="apple-touch-icon" href="rootflow-home-180.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="capital.css">
  <link rel="stylesheet" href="effects.css">
  <link rel="stylesheet" href="brand/rootflow-splash.css">
</head>
<body class="splash-active">
  <div id="opening-splash" class="opening-splash" aria-hidden="true">
    <div class="splash-halo"></div>
    <div class="splash-lockup">
      <img class="splash-mark" src="brand/rootflow-mark.png" alt="" draggable="false">
      <div class="splash-wordmark"><span>root</span><strong>flow</strong></div>
      <div class="splash-copyright">© 2026 <strong>@derekdaydoi</strong>. All rights reserved.</div>
    </div>
  </div>
  <div id="root"><div class="boot">Đang mở Rootflow…</div></div>
  <noscript><div class="boot">Rootflow cần JavaScript để chạy.</div></noscript>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="domain.js"></script>
  <script src="cashflow-domain.js"></script>
  <script src="capital-domain.js"></script>
  <script src="compat.js"></script>
  <script src="i18n-base.js"></script>
  <script src="i18n-capital.js"></script>
  <script src="store.js"></script>
  <script src="store-adapter.js"></script>
  <script src="selftest.js"></script>
  <script src="capital-ui.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      var splash = document.getElementById('opening-splash');
      if (!splash) return;
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.setTimeout(function () {
        document.body.classList.remove('splash-active');
        splash.remove();
      }, reduced ? 650 : 4150);
    })();
  </script>
</body>
</html>
