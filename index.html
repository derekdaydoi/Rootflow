<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
  <script>
    (function () {
      var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      if (standalone) document.documentElement.classList.add('standalone-pwa');

      function blockViewportGesture(event) {
        event.preventDefault();
      }
      document.addEventListener('gesturestart', blockViewportGesture, { passive: false });
      document.addEventListener('gesturechange', blockViewportGesture, { passive: false });
      document.addEventListener('gestureend', blockViewportGesture, { passive: false });
      document.addEventListener('touchmove', function (event) {
        if (event.touches && event.touches.length > 1) event.preventDefault();
      }, { passive: false });
    })();
  </script>
  <meta name="theme-color" content="#0F6B45">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rootflow">
  <meta name="description" content="Rootflow — hệ thống điều hành vốn và dòng tiền cá nhân.">
  <title>Rootflow — Vốn & Dòng tiền</title>
  <link rel="manifest" href="manifest.json?v=20260909-homescreen-v2">
  <link rel="icon" href="rootflow-icon-192-v2.png?v=20260909" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="rootflow-touch-180-v2.png?v=20260909" sizes="180x180">
  <link rel="preload" as="image" href="brand/rootflow-opening-logo.webp?v=20260909-green-v4" type="image/webp">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="capital.css">
  <link rel="stylesheet" href="brand/rootflow-theme.css">
  <link rel="stylesheet" href="brand/rootflow-splash.css">
</head>
<body class="splash-active">
  <div id="opening-splash" class="opening-splash" aria-hidden="true">
    <div class="splash-orbit splash-orbit-a"></div>
    <div class="splash-orbit splash-orbit-b"></div>
    <div class="splash-lockup">
      <div class="splash-logo-frame">
        <img class="splash-logo" src="brand/rootflow-opening-logo.webp?v=20260909-green-v4" alt="" aria-hidden="true" loading="eager" decoding="sync" fetchpriority="high">
      </div>
      <div class="splash-copy">
        <div class="splash-tagline">Rootflow - Nơi dòng tiền được quản trị theo hệ thống</div>
        <div class="splash-copyright">© 2026 derekdaydoi. All rights reserved.</div>
      </div>
    </div>
  </div>
  <div id="root"><div class="boot">Đang mở Rootflow…</div></div>
  <noscript><div class="boot">Rootflow cần JavaScript để chạy.</div></noscript>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="domain.js"></script>
  <script src="cashflow-domain.js"></script>
  <script src="capital-domain.js"></script>
  <script src="operating-policy.js"></script>
  <script src="store.js"></script>
  <script src="selftest.js"></script>
  <script src="capital-ui.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      var splash = document.getElementById('opening-splash');
      if (!splash) return;
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.setTimeout(function () {
        document.body.classList.remove('splash-active');
        splash.remove();
      }, reduced ? 900 : 4300);
    })();
  </script>
</body>
</html>
